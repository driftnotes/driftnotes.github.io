title: driftnotes
author: Jing Lee
email: g[surname]@gmail.com   # update or remove
description: >-
  Travels, experiences, and academic musings — written slowly.
url: "https://driftnotes.github.io"

highlighter: rouge
permalink: /blog/:year/:month/:day/:title/

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-katex

katex:
  js_path: "assets"
  rendering_options:
    throw_error: false
    error_color: "#cc0000"

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "default"
