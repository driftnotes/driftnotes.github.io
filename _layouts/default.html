<html>
<head>
    <title>{{ page.title }} — driftnotes</title>
    <meta charset='UTF-8'>
    <meta content='width=device-width, initial-scale=1' name='viewport'/>

    <meta name='description' content='{{ page.subtitle | default: site.description }}'>
    <meta name='keywords' content='{{ page.keywords }}'>
    <meta name='author' content='{{ site.author }}'>

    <link rel='shortcut icon' href='/favicon.png' />
    <link href='/css/blog.css' rel='stylesheet'/>
    <link href='/css/trac.css' rel='stylesheet'/>
    <link href='/css/markdown.css' rel='stylesheet'/>
</head>
<body>
<div class='content'>
    {% include nav.html %}
    <div class='front-matter'>
        <div class='wrap'>
            <h1>{{ page.title }}</h1>
            <h4>{{ page.subtitle }}</h4>
            <div class='bylines'>
                <div class='byline'>
                    <h3>Published</h3>
                    <p>{{ page.date | date: '%d %B %Y' }}</p>
                </div>
                {% if page.categories %}
                <div class='byline'>
                    <h3>Category</h3>
                    <p>
                        {% for cat in page.categories %}
                            <a href="/{{ cat }}/">{{ cat | capitalize }}</a>{% unless forloop.last %}, {% endunless %}
                        {% endfor %}
                    </p>
                </div>
                {% endif %}
            </div>
            <div class='clear'></div>
        </div>
    </div>
    <div class='wrap article'>
        {{ content }}
    </div>
</div>
</body>
</html>
